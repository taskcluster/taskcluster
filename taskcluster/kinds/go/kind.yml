---
loader: taskgraph.loader.transform:loader

transforms:
  - src.transforms:add_task_env
  - src.transforms:parameterize_mounts
  - src.transforms:parameterize_artifacts
  - taskgraph.transforms.run
  - taskgraph.transforms.task

task-defaults:
  worker-type: gw-ubuntu-24-04
  run:
    using: bare
    install:
      - |
        set -vx
        export CGO_ENABLED=0
        export GOROOT="$(pwd)/$GO_VERSION/go"
        export GOPATH="$(pwd)/gopath$GO_RELEASE"
        export PATH="${{GOPATH}}/bin:${{GOROOT}}/bin:$(pwd)/bin:${{PATH}}"
        git --version
        go version
        go env
        git config --global --add safe.directory "$(pwd)/taskcluster"
        if [ ! -d taskcluster/.git ]; then
          git clone {head_repository} taskcluster
        fi
        cd taskcluster
        git config advice.detachedHead false
        git fetch {head_repository} "${{GITHUB_SHA}}"
        git checkout -f "${{GITHUB_SHA}}"
        git reset --hard "${{GITHUB_SHA}}"
        git clean -fd
  attributes:
    code-review: true
  worker:
    max-run-time: 600
    mounts:
      - cache-name: checkouts
        directory: taskcluster
      - content:
          url: 'https://go.dev/dl/{go_version}.linux-amd64.tar.gz'
        directory: '{go_version}'
        format: tar.gz
      - content:
          url: 'https://github.com/golangci/golangci-lint/releases/download/v{golangci_lint_version}/golangci-lint-{golangci_lint_version}-linux-amd64.tar.gz'
        directory: golangci-lint
        format: tar.gz

tasks:
  generic-worker-insecure-untrusted:
    description: test generic-worker's insecure engine against mock Taskcluster services
    run-on-tasks-for: [github-pull-request-untrusted]
    # Same pool and user setup as the trusted build/test-insecure task: the
    # suite needs the gui pool's devices (e.g. /dev/video* for loopback tests)
    # and runs generic-worker instances as the current user.
    worker-type: gw-ubuntu-24-04-gui
    attributes:
      run-without-secrets: true
    worker:
      max-run-time: 1800
      run-task-as-current-user: true
    run:
      command:
        - |
          cd workers/generic-worker
          go mod tidy
          git status --short
          test -z "$(git status --porcelain)"
          go install -tags insecure -v -ldflags "-X main.revision=${{GITHUB_SHA}}" ./...
          go install ../../tools/taskcluster-proxy
          go install ../../tools/livelog
          go vet -tags insecure ./...
          GORACE=history_size=7 CGO_ENABLED=1 go test -tags insecure -failfast -timeout 20m -ldflags "-X github.com/taskcluster/taskcluster/v107/workers/generic-worker.revision=${{GITHUB_SHA}}" -race -vet=off ./...
          ../../../golangci-lint/golangci-lint-$GOLANGCI_LINT_VERSION-*/golangci-lint run --build-tags insecure --timeout=5m
  internal-libraries:
    description: test internal go libraries
    run:
      command: >-
        cd internal &&
        ../../golangci-lint/golangci-lint-$GOLANGCI_LINT_VERSION-*/golangci-lint run --timeout=5m &&
        go test -v ./...
  tools:
    description: test golang tools
    run:
      command:
        - |
          cd tools
          go vet ./...
          D2G_UPDATE_TEST_EXPECTATIONS=true go test -v ./...
          git diff --exit-code || (echo "D2G test expectations are not formatted properly. Run tests with `D2G_UPDATE_TEST_EXPECTATIONS` and commit the difference" && exit 1)
          ../../golangci-lint/golangci-lint-$GOLANGCI_LINT_VERSION-*/golangci-lint run --timeout=5m
          cd d2g
          go generate ./...
          go mod tidy
          git status
          test $(git status --porcelain | wc -l) == 0
          go install ./...
  modernize:
    description: ensure go code is modern
    run:
      command:
        - |
          GOFLAGS="-tags=insecure" go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@latest -test ./...
          GOFLAGS="-tags=multiuser" go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@latest -test ./...
