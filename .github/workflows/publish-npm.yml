name: Publish NPM Packages
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish NPM packages
    runs-on: ubuntu-latest
    # Only run on the main repo, not forks or staging
    if: github.repository == 'taskcluster/taskcluster'
    permissions:
      id-token: write    # Required: OIDC token generation for NPM trusted publishing
      contents: read     # Required: download release assets
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false
          # registry-url is REQUIRED for trusted publishing — triggers setup-node
          # to write a .npmrc with proper authentication configuration
          registry-url: 'https://registry.npmjs.org'

      - name: Download and publish NPM tarballs
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"

          # The release graph publishes the GitHub release only after every asset is uploaded,
          # so all tarballs must already be attached when this workflow runs.
          for NAME in @taskcluster/client @taskcluster/client-web; do
            # npm refuses to republish a version, so a re-run after a partial publish
            # skips the packages that made it and publishes the rest.
            if [ "$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "${NAME}@${VERSION} is already on npm, skipping"
              continue
            fi
            PACKAGE="taskcluster-${NAME#@taskcluster/}-${VERSION}.tgz"
            if ! gh release download "$RELEASE_TAG" --repo taskcluster/taskcluster --pattern "$PACKAGE"; then
              echo "ERROR: ${PACKAGE} is not attached to release ${RELEASE_TAG}"
              exit 1
            fi
            if [ ! -f "$PACKAGE" ]; then
              echo "ERROR: ${PACKAGE} was not downloaded from release ${RELEASE_TAG}"
              exit 1
            fi

            npm publish "$PACKAGE" --provenance --access public
          done
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
