$schema: "/schemas/common/metaschema.json#"
title: Worker Stopped Pulse Message
description: The message that is emitted when workers have stopped.
type: object
properties:
  workerPoolId: {$ref: "worker-pool-full.json#/properties/workerPoolId"}
  providerId: {$ref: "worker-pool-full.json#/properties/providerId"}
  workerId: {$ref: "worker-full.json#/properties/workerId"}
  workerGroup: {$ref: "worker-full.json#/properties/workerGroup"}
  capacity: {$ref: "worker-full.json#/properties/capacity"}
  launchConfigId: {$ref: "worker-full.json#/properties/launchConfigId"}
  reason:
    title: Reason
    type: string
    description: |
      The reason the worker was seen as stopped, when the provider can tell.
      For example, the state the instance was found in, or that the instance
      no longer exists.
  timestamp:
    title: Event timestamp
    description: Date and time when this event occurred
    type: string
    format: date-time

additionalProperties: false
required:
  - workerPoolId
  - providerId
  - workerId
  - workerGroup
  - capacity
  - timestamp
