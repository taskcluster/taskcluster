type Secret {
  name: String!
  secret: JSON!
  expires: DateTime!
}

input SecretInput {
  secret: JSON!
  expires: DateTime!
}

extend type Query {
  secret(name: String!): Secret
}

extend type Mutation {
  createSecret(name: String!, secret: SecretInput!): Secret
  updateSecret(name: String!, secret: SecretInput!): Secret
  deleteSecret(name: String!): String
}
